<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- The link itself is the key, so it must not leak to the map servers. -->
  <meta name="referrer" content="no-referrer">
  <title>Ζωντανή θέση μοτοσυκλέτας</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #111827;
      --muted: #5b6472;
      --border: #e1e4ea;
      --accent: #ea580c;
      --danger: #dc2626;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --surface: #131924;
        --text: #e6e8eb;
        --muted: #9aa3b0;
        --border: #253143;
        color-scheme: dark;
      }
    }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
    #map { position: fixed; inset: 0; }
    .info {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      gap: 6px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgb(0 0 0 / 0.18);
    }
    .info h1 { margin: 0; font-size: 1rem; }
    .info p { margin: 0; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .alarm { color: var(--danger); font-weight: 700; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .buttons > * {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .buttons .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .bike { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 6px rgb(0 0 0 / 0.45); }
    .bike.alarm { background: var(--danger); }
  </style>
</head>
<body>
  <div id="map" aria-label="Χάρτης"></div>
  <section class="info" aria-live="polite">
    <h1>Ζωντανή θέση μοτοσυκλέτας</h1>
    <p id="status">Φόρτωση…</p>
    <p id="details" class="muted"></p>
    <div id="buttons" class="buttons" hidden>
      <button id="recenter" type="button">Δείξε τη μηχανή</button>
      <a id="directions" class="primary" target="_blank" rel="noopener noreferrer">Οδηγίες ως εκεί</a>
    </div>
  </section>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script type="module" src="/js/share.js"></script>
</body>
</html>
