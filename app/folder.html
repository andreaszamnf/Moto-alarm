<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- The link itself is the key, so it must not leak to the map servers. -->
  <meta name="referrer" content="no-referrer">
  <title>Φάκελος κλοπής μοτοσυκλέτας</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --text: #111827;
      --muted: #5b6472;
      --border: #e1e4ea;
      --accent: #ea580c;
      --danger: #dc2626;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --surface: #131924;
        --surface-2: #1c2431;
        --text: #e6e8eb;
        --muted: #9aa3b0;
        --border: #253143;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
    h1 { margin: 4px 0 0; font-size: 1.35rem; }
    h2 { margin: 0 0 8px; font-size: 1.05rem; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; }
    .alarm { color: var(--danger); font-weight: 700; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .photos img { width: 100%; border-radius: 12px; border: 1px solid var(--border); }
    #map { height: min(55vh, 460px); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 8px; text-align: left; border-top: 1px solid var(--border); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; border-top: 0; }
    td a { color: var(--accent); }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .buttons > * { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; text-decoration: none; cursor: pointer; }
    .buttons .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .start { width: 16px; height: 16px; border-radius: 50%; background: #16a34a; border: 3px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / 0.4); }
    .bike { width: 24px; height: 24px; border-radius: 50%; background: var(--danger); border: 3px solid #fff; box-shadow: 0 1px 6px rgb(0 0 0 / 0.45); }
    @media print {
      :root { --bg: #fff; --surface: #fff; --text: #000; --muted: #444; --border: #bbb; color-scheme: light; }
      .buttons { display: none; }
      .card { break-inside: avoid; }
      #map { height: 380px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Φάκελος κλοπής μοτοσυκλέτας</h1>
      <p id="status" class="muted">Φόρτωση…</p>
    </header>

    <section id="bike-card" class="card" hidden>
      <h2>Στοιχεία</h2>
      <dl id="bike"></dl>
    </section>

    <section id="photos-card" class="card" hidden>
      <h2>Φωτογραφίες</h2>
      <div id="photos" class="photos"></div>
    </section>

    <section id="alarm-card" class="card" hidden>
      <h2>Συναγερμός και διαδρομή</h2>
      <p id="alarm-text"></p>
      <p id="last-text" class="muted"></p>
      <div id="map" aria-label="Χάρτης με τη διαδρομή" hidden></div>
      <div class="buttons" style="margin-top: 10px">
        <a id="directions" class="primary" target="_blank" rel="noopener noreferrer" hidden>Τελευταία θέση στο Google Maps</a>
        <button id="print" type="button">Εκτύπωση ή PDF</button>
      </div>
    </section>

    <section id="times-card" class="card" hidden>
      <h2>Θέσεις με ώρες</h2>
      <p class="muted">Από τη συσκευή GPS στη μηχανή. Ώρα Ελλάδας.</p>
      <table>
        <thead><tr><th>Ώρα</th><th>Θέση</th><th>Ταχύτητα</th></tr></thead>
        <tbody id="times"></tbody>
      </table>
    </section>

    <p id="expires" class="muted"></p>
  </main>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script type="module" src="/js/folder.js"></script>
</body>
</html>
